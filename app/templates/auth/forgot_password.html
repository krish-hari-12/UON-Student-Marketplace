
{% extends "base.html" %}

{% block title %}Forgot Password - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h1 class="h4 text-center mb-3">Forgot Password?</h1>

            <p class="text-muted text-center small">
                Enter your registered UoN email address.
                We'll send you a verification code to reset your password.
            </p>

            <form method="post" action="{{ url_for('auth.forgot_password') }}">
                <input
                    type="hidden"
                    name="_csrf"
                    value="{{ csrf_token() }}"
                >

                <div class="mb-3">
                    <label for="email" class="form-label">UoN email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="firstname.lastname@uon.edu.au"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Send Verification Code
                </button>
            </form>

            <hr>

            <p class="text-center mb-0">
                <a href="{{ url_for('auth.login') }}">
                    Back to Login
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
