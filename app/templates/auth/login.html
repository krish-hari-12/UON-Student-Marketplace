{% extends "base.html" %}
{% block title %}Log in - {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h1 class="h4 mb-3 text-center">Log in</h1>
      <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">UoN email</label>
          <input type="email" name="email" class="form-control" required
                 placeholder="firstname.lastname@uon.edu.au" value="{{ form.email or '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Log in</button>
      </form>
      <hr>
      <p class="text-center text-muted mb-0">New to the marketplace?
        <a href="{{ url_for('auth.register') }}">Register with your UoN email</a></p>
    </div>
  </div>
</div>
{% endblock %}
