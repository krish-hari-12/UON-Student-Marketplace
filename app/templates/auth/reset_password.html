
{% extends "base.html" %}

{% block title %}Reset Password - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h1 class="h4 text-center mb-3">Set New Password</h1>

            <p class="text-muted text-center small">
                Enter your new password below.
            </p>

            <form method="post" action="{{ url_for('auth.reset_password') }}">
                <input
                    type="hidden"
                    name="_csrf"
                    value="{{ csrf_token() }}"
                >

                <div class="mb-3">
                    <label for="new-password" class="form-label">
                        New password
                    </label>

                    <input
                        type="password"
                        id="new-password"
                        name="password"
                        class="form-control"
                        minlength="{{ config.MIN_PASSWORD_LENGTH }}"
                        autocomplete="new-password"
                        required
                    >

                    <div class="text-danger small">
                        {{ errors.password }}
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirm-new-password" class="form-label">
                        Confirm new password
                    </label>

                    <input
                        type="password"
                        id="confirm-new-password"
                        name="confirm_password"
                        class="form-control"
                        autocomplete="new-password"
                        required
                    >

                    <div class="text-danger small">
                        {{ errors.confirm_password }}
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
