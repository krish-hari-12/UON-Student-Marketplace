
{% extends "base.html" %}

{% block title %}Verify Email - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h1 class="h4 text-center mb-2">Verify your email</h1>

            <p class="text-muted text-center small">
                We have sent a 6-digit verification code to:
            </p>

            <p class="text-center fw-semibold">
                {{ email }}
            </p>

            <form method="post" action="{{ url_for('auth.verify_registration') }}">
                <input
                    type="hidden"
                    name="_csrf"
                    value="{{ csrf_token() }}"
                >

                <div class="mb-3">
                    <label for="verification-code" class="form-label">
                        Verification code
                    </label>

                    <input
                        type="text"
                        id="verification-code"
                        name="otp"
                        class="form-control text-center"
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        minlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <p class="text-muted small text-center">
                    Your verification code expires in 5 minutes.
                </p>

                <button type="submit" class="btn btn-success w-100">
                    Verify Email
                </button>
            </form>

            <hr>

            <p class="text-center text-muted mb-0">
                Already verified?
                <a href="{{ url_for('auth.login') }}">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
