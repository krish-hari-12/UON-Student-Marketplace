
{% extends "base.html" %}

{% block title %}Verify Reset OTP - {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h1 class="h4 text-center mb-3">Verify OTP</h1>

            <p class="text-muted text-center small">
                Enter the 6-digit verification code sent to:
            </p>

            <p class="text-center fw-semibold">
                {{ email }}
            </p>

            <form method="post" action="{{ url_for('auth.verify_reset_otp') }}">
                <input
                    type="hidden"
                    name="_csrf"
                    value="{{ csrf_token() }}"
                >

                <div class="mb-3">
                    <label for="reset-otp" class="form-label">
                        Verification code
                    </label>

                    <input
                        type="text"
                        id="reset-otp"
                        name="otp"
                        class="form-control text-center"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        minlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <p class="text-muted small text-center">
                    Your code expires in 5 minutes.
                </p>

                <button type="submit" class="btn btn-success w-100">
                    Verify OTP
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
