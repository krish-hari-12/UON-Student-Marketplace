
{% extends "base.html" %}

{% block title %}Access Denied - {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">403 - Access denied</h1>

    <p class="text-muted">
        You do not have permission to perform this action. If you believe
        this is an error, contact a marketplace administrator.
    </p>

    <a class="btn btn-success" href="{{ url_for('main.home') }}">
        Back to home
    </a>
</div>
{% endblock %}
