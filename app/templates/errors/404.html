
{% extends "base.html" %}

{% block title %}Page Not Found - {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">404 - Page not found</h1>

    <p class="text-muted">
        The listing or page you are looking for does not exist or is no longer
        available.
    </p>

    <a class="btn btn-success" href="{{ url_for('main.browse') }}">
        Browse listings
    </a>
</div>
{% endblock %}
