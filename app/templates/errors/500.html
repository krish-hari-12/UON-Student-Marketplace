
{% extends "base.html" %}

{% block title %}Server Error - {{ app_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">500 — Something went wrong</h1>

    <p class="text-muted">
        An unexpected error occurred. Please try again. If the problem persists,
        contact the team.
    </p>

    <a class="btn btn-success" href="{{ url_for('main.home') }}">
        Back to home
    </a>
</div>
{% endblock %}
